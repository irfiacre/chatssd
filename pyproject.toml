[project]
name = "chatssd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "irfiacre", email = "irfiacre@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "africastalking>=2.0.3",
    "dotenv>=0.9.9",
    "flask>=3.1.3",
    "langchain>=1.3.15",
    "langchain-google-genai>=4.3.4",
    "langchain-mistralai>=1.1.6",
    "phonenumbers>=9.0.37",
    "pycountry>=26.2.16",
    "pydantic>=2.13.4",
]

[project.scripts]
chatssd = "chatssd:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
